<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yazı Detayı | TOPKAPI GATE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-heading { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-[#0A74DA] text-white min-h-screen flex flex-col justify-between selection:bg-[#FFD230] selection:text-black">

  <!-- HEADER -->
  <header class="bg-[#0A74DA]/90 backdrop-blur-md border-b border-white/20 px-6 py-4 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3">
        <div class="bg-[#FAF9F5] px-2 py-1 rounded-lg">
          <img src="topkapiLogo.jpg" alt="Logo" class="h-6 w-auto mix-blend-multiply">
        </div>
        <span class="font-heading font-bold text-sm tracking-wider uppercase">TOPKAPI GATE</span>
      </a>
      <a href="blog.html" class="text-xs font-semibold text-sky-100 hover:text-white bg-white/10 hover:bg-white/20 px-3.5 py-2 rounded-xl transition-all flex items-center gap-1.5">
        ← Tüm Yazılar
      </a>
    </div>
  </header>

  <!-- YAZI İÇERİK ALANI -->
  <main class="max-w-4xl mx-auto px-6 py-12 flex-1 w-full">
    <div id="loading" class="text-center py-20 text-sky-200">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-white border-t-transparent mb-3"></div>
      <p class="text-sm">Yazı yükleniyor...</p>
    </div>

    <article id="post-content" class="hidden bg-[#0B132B] border border-slate-800 rounded-3xl p-8 sm:p-12 shadow-2xl space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-6">
        <span id="post-category" class="bg-[#FFD230]/20 text-[#FFD230] text-xs font-bold px-3 py-1.5 rounded-full border border-[#FFD230]/30"></span>
        <span id="post-date" class="text-xs text-slate-400 font-medium"></span>
      </div>

      <h1 id="post-title" class="font-heading text-2xl sm:text-4xl font-extrabold text-white leading-tight"></h1>

      <div id="post-body" class="text-slate-300 text-base sm:text-lg leading-relaxed whitespace-pre-line pt-4 border-t border-slate-800/60"></div>
    </article>
  </main>

  <!-- FOOTER -->
  <footer class="bg-[#050B1A] border-t border-slate-800 text-slate-400 py-6 text-center text-xs">
    <p>&copy; 2026 TOPKAPI GATE. Tüm hakları saklıdır.</p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://idztvxoteubrpelwqums.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkenR2eG90ZXVicnBlbHdxdW1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTAzOTYsImV4cCI6MjEwMTI2NjM5Nn0.n4gAZdnEXIm1fjPlxf1J4WTLPXG31UjZTyl_CGQrsTg';

    async function loadSinglePost() {
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get('id');

      if (!postId) {
        window.location.href = 'blog.html';
        return;
      }

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/posts?id=eq.${postId}&select=*`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        const data = await response.json();
        document.getElementById('loading').classList.add('hidden');

        if (!data || data.length === 0) {
          document.getElementById('post-content').innerHTML = `
            <div class="text-center py-10 text-rose-400">
              <p class="font-bold text-lg">Yazı bulunamadı veya silinmiş.</p>
              <a href="blog.html" class="mt-4 inline-block text-xs text-sky-300 underline">Blog listesine geri dön</a>
            </div>
          `;
          document.getElementById('post-content').classList.remove('hidden');
          return;
        }

        const post = data[0];
        document.getElementById('post-title').innerText = post.title;
        document.getElementById('post-category').innerText = post.category || 'Genel';
        document.getElementById('post-body').innerText = post.content;
        
        const postDate = post.created_at ? new Date(post.created_at).toLocaleDateString('tr-TR') : '2026';
        document.getElementById('post-date').innerText = postDate;

        document.getElementById('post-content').classList.remove('hidden');
      } catch (e) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('post-content').innerHTML = `<p class="text-rose-400">Yazı alınamadı.</p>`;
        document.getElementById('post-content').classList.remove('hidden');
      }
    }

    loadSinglePost();
  </script>
</body>
</html>
