<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönetici Girişi & Panel | TOPKAPI GATE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-heading { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-[#0A74DA] text-white min-h-screen flex flex-col justify-between selection:bg-[#FFD230] selection:text-black">

  <!-- HEADER -->
  <header class="bg-[#0A74DA]/90 backdrop-blur-md border-b border-white/20 px-6 py-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3">
        <div class="bg-[#FAF9F5] px-2 py-1 rounded-lg">
          <img src="topkapiLogo.jpg" alt="Logo" class="h-6 w-auto mix-blend-multiply">
        </div>
        <span class="font-heading font-bold text-sm tracking-wider uppercase">TOPKAPI GATE</span>
      </a>

      <div class="flex items-center gap-3 text-xs font-semibold">
        <a href="blog.html" class="text-sky-100 hover:text-white transition-colors">Blog</a>
        <a href="index.html" class="bg-white/10 text-white px-3 py-1.5 rounded-xl hover:bg-white/20 transition-all">Ana Sayfa</a>
        
        <!-- ÇIKIŞ YAP BUTONU (Sadece Giriş Yapıldığında Görünür) -->
        <button id="nav-logout-btn" onclick="logout()" class="hidden bg-rose-500/20 hover:bg-rose-500 text-rose-200 hover:text-white border border-rose-500/30 px-3.5 py-1.5 rounded-xl transition-all flex items-center gap-1.5">
          <span>Çıkış Yap</span>
          <span>🚪</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ANA ALAN -->
  <main class="max-w-3xl mx-auto px-6 py-10 flex-1 w-full flex flex-col justify-center">

    <!-- 1. GİRİŞ FORMU (GİRİŞ YAPILMAMIŞSA GÖRÜNÜR) -->
    <div id="login-section" class="bg-[#0B132B] border border-slate-800 rounded-3xl p-8 sm:p-10 shadow-2xl space-y-6 max-w-md mx-auto w-full">
      <div class="text-center space-y-2">
        <div class="inline-flex p-3 rounded-2xl bg-white/5 border border-white/10 mb-2">
          🔒
        </div>
        <h1 class="font-heading text-2xl font-bold text-white">Yönetici Girişi</h1>
        <p class="text-xs text-slate-400">Blog içeriklerini yönetmek için giriş yapın.</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Kullanıcı Adı</label>
          <input type="text" id="login-username" required placeholder="admin" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#FFD230] transition-colors">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Şifre</label>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#FFD230] transition-colors">
        </div>

        <button type="submit" id="login-btn" class="w-full bg-[#FFD230] hover:bg-[#e6bd28] text-slate-950 font-bold py-3 rounded-xl transition-all shadow-lg text-sm flex items-center justify-center gap-2 mt-2">
          <span>Giriş Yap 🚀</span>
        </button>
      </form>
    </div>

    <!-- 2. YÖNETİM PANELİ (GİRİŞ YAPILMIŞSA GÖRÜNÜR) -->
    <div id="dashboard-section" class="hidden space-y-8">
      
      <!-- BLOG OLUŞTURMA KARTI -->
      <div class="bg-[#0B132B] border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
          <div>
            <h1 class="font-heading text-2xl font-bold text-white">Yönetim Paneli</h1>
            <p class="text-xs text-slate-400 mt-1">Yeni bir blog yazısı oluşturun.</p>
          </div>
          <button onclick="logout()" class="text-xs font-semibold text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 px-3 py-1.5 rounded-lg border border-rose-500/20 transition-all">
            Çıkış Yap 🚪
          </button>
        </div>

        <form id="post-form" onsubmit="createPost(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Yazı Başlığı</label>
            <input type="text" id="post-title" required placeholder="Örn: Donanım Test Sonuçları" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#FFD230] transition-colors">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Kategori</label>
            <input type="text" id="post-category" required placeholder="Örn: FPGA, Gömülü Sistemler" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#FFD230] transition-colors">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">İçerik</label>
            <textarea id="post-content" rows="6" required placeholder="Yazı detayları..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#FFD230] transition-colors"></textarea>
          </div>

          <button type="submit" id="submit-btn" class="w-full bg-[#FFD230] hover:bg-[#e6bd28] text-slate-950 font-bold py-3.5 rounded-xl transition-all shadow-lg text-sm flex items-center justify-center gap-2">
            <span>Yazıyı Yayınla 🚀</span>
          </button>
        </form>
      </div>

      <!-- MEVCUT YAZILARI LİSTELEME & SİLME -->
      <div class="bg-[#0B132B] border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-4">
        <h2 class="font-heading text-lg font-bold text-white border-b border-slate-800 pb-3">Mevcut Blog Yazıları</h2>
        <div id="admin-posts-list" class="space-y-3">
          <p class="text-xs text-slate-400">Yükleniyor...</p>
        </div>
      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-[#050B1A] border-t border-slate-800 text-slate-400 py-6 text-center text-xs">
    <p>&copy; 2026 TOPKAPI GATE. Tüm hakları saklıdır.</p>
  </footer>

  <!-- SCRIPT -->
  <script>
    const SUPABASE_URL = 'https://idztvxoteubrpelwqums.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkenR2eG90ZXVicnBlbHdxdW1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTAzOTYsImV4cCI6MjEwMTI2NjM5Nn0.n4gAZdnEXIm1fjPlxf1J4WTLPXG31UjZTyl_CGQrsTg';

    // 1. OTURUM DURUMU KONTROLÜ
    function checkAuth() {
      const isLoggedIn = sessionStorage.getItem('is_admin_logged') === 'true';
      const loginSec = document.getElementById('login-section');
      const dashSec = document.getElementById('dashboard-section');
      const navLogoutBtn = document.getElementById('nav-logout-btn');

      if (isLoggedIn) {
        loginSec.classList.add('hidden');
        dashSec.classList.remove('hidden');
        navLogoutBtn.classList.remove('hidden');
        loadAdminPosts();
      } else {
        loginSec.classList.remove('hidden');
        dashSec.classList.add('hidden');
        navLogoutBtn.classList.add('hidden');
      }
    }

    // 2. GİRİŞ YAP
    async function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('login-username').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      const loginBtn = document.getElementById('login-btn');

      loginBtn.disabled = true;
      loginBtn.innerText = 'Kontrol ediliyor...';

      try {
        // Supabase admins tablosundan doğrulama
        const res = await fetch(`${SUPABASE_URL}/rest/v1/admins?username=eq.${user}&password=eq.${pass}&select=*`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        const data = await res.json();

        if (data && data.length > 0) {
          sessionStorage.setItem('is_admin_logged', 'true');
          checkAuth();
        } else {
          alert('Hatalı kullanıcı adı veya şifre!');
        }
      } catch (err) {
        alert('Giriş yapılırken sunucu hatası oluştu.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = 'Giriş Yap 🚀';
      }
    }

    // 3. ÇIKIŞ YAP (LOGOUT)
    function logout() {
      if (confirm('Yönetici oturumunu kapatmak istiyor musunuz?')) {
        sessionStorage.removeItem('is_admin_logged');
        checkAuth();
      }
    }

    // 4. YAZILARI LİSTELE
    async function loadAdminPosts() {
      const listContainer = document.getElementById('admin-posts-list');
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/posts?select=*&order=id.desc`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        const posts = await res.json();

        if (!posts || posts.length === 0) {
          listContainer.innerHTML = `<p class="text-xs text-slate-500">Henüz yayınlanmış yazı bulunmuyor.</p>`;
          return;
        }

        listContainer.innerHTML = posts.map(p => `
          <div class="flex items-center justify-between p-4 bg-slate-900 rounded-xl border border-slate-800">
            <div>
              <p class="text-sm font-bold text-white">${p.title}</p>
              <p class="text-xs text-slate-400">${p.category || 'Genel'} • ${p.created_at ? new Date(p.created_at).toLocaleDateString('tr-TR') : ''}</p>
            </div>
            <button onclick="deletePost(${p.id})" class="text-xs bg-rose-500/20 hover:bg-rose-500 text-rose-300 hover:text-white px-3 py-1.5 rounded-lg border border-rose-500/30 transition-all">
              Sil
            </button>
          </div>
        `).join('');
      } catch (err) {
        listContainer.innerHTML = `<p class="text-xs text-rose-400">Yazılar yüklenemedi.</p>`;
      }
    }

    // 5. YAZI EKLE
    async function createPost(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const title = document.getElementById('post-title').value;
      const category = document.getElementById('post-category').value;
      const content = document.getElementById('post-content').value;

      btn.disabled = true;
      btn.innerText = 'Yayınlanıyor...';

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/posts`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ title, category, content })
        });

        if (!res.ok) throw new Error('Kayıt başarısız');

        alert('Yazı başarıyla yayınlandı! 🎉');
        document.getElementById('post-form').reset();
        loadAdminPosts();
      } catch (err) {
        alert('Hata: Yazı yayınlanamadı.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Yazıyı Yayınla 🚀';
      }
    }

    // 6. YAZI SİL
    async function deletePost(id) {
      if (!confirm('Bu yazıyı silmek istediğinizden emin misiniz?')) return;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/posts?id=eq.${id}`, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        if (!res.ok) throw new Error('Silme işlemi başarısız');
        loadAdminPosts();
      } catch (err) {
        alert('Yazı silinirken bir hata oluştu.');
      }
    }

    // Başlangıç kontrolü
    checkAuth();
  </script>
</body>
</html>
